<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="universe" style="background-image: url(&quot;./galaxy.webp&quot;)">
    <div class="system">
      <div class="sun center" style="--img: url(&quot;./sun.png&quot;)"></div>

      <div class="orbit" style="--r: 150px; --speed: 8.8s">
        <div class="planet center" style="--size: 15px; --spin: 5.86s; --img: url(&quot;./mercury.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 200px; --speed: 22.5s">
        <div class="planet center" style="--size: 20px; --spin: 24.3s; --img: url(&quot;./venus.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 300px; --speed: 36.5s">
        <div class="planet center" style="--size: 23px; --spin: 1s; --img: url(&quot;./earth.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 400px; --speed: 68.7s">
        <div class="planet center" style="--size: 17px; --spin: 1.025s; --img: url(&quot;./mars.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 550px; --speed: 118.6s">
        <div class="planet center" style="--size: 45px; --spin: 0.41s; --img: url(&quot;./jupiter.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 650px; --speed: 294.6s">
        <div class="planet center" style="--size: 40px; --spin: 0.445s; --img: url(&quot;./saturn.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 750px; --speed: 840s">
        <div class="planet center" style="--size: 35px; --spin: 0.717s; --img: url(&quot;./uranus.png&quot;)"></div>
      </div>

      <div class="orbit" style="--r: 850px; --speed: 1648s">
        <div class="planet center" style="--size: 33px; --spin: 0.671s; --img: url(&quot;./neptune.png&quot;)"></div>
      </div>
    </div>
  </body>
</html>
